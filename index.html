<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noor – Prayer Times</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
 <!-- PRAYER VIEW -->
 <section class="view on" id="v-times">
  <header class="glass hdr">
   <div><div class="d" id="gdate">—</div><div class="h" id="hdate">—</div></div>
   <div class="loc"><b id="city">Bingöl</b><span id="country">Türkiye</span></div>
  </header>
  <div class="hero">
   <small data-i="next">Next prayer</small>
   <h2 id="nextName">—</h2>
   <div class="cd" id="cd">--:--:--</div>
   <div class="bar"><i id="prog"></i></div>
   <div class="at" id="nextAt">—</div>
  </div>
  <div class="glass list" id="list"></div>
  <div class="glass verse">
   <div class="ar" id="vAr"></div><p id="vTx"></p><span id="vRef"></span>
  </div>
  <div class="src" id="src"></div>
 </section>
 <!-- QIBLA VIEW -->
 <section class="view" id="v-qibla">
  <div class="title" data-i="t_qibla">Qibla</div>
  <div class="glass center">
   <div class="dial"><div class="k" id="needle"></div><em id="deg">--°</em></div>
   <p id="qtxt" data-i="qtxt" style="color:var(--muted);margin:14px 0 18px">Qibla direction from your city, measured clockwise from north.</p>
   <button class="btn" id="compassBtn" data-i="compass">Use phone compass</button>
  </div>
 </section>
 <!-- TASBIH VIEW -->
 <section class="view" id="v-tasbih">
  <div class="title" data-i="t_dhikr">Dhikr</div>
  <div class="glass center">
   <div id="dhikrName" style="font-family:Amiri,serif;font-size:26px;color:var(--gold)">سُبْحَانَ ٱللَّٰه</div>
   <p style="margin:2px 0 14px;color:var(--muted)">Subhanallah · tap the ring to count</p>
   <button class="ring" id="ring" aria-label="Count"><span id="count">0</span></button>
   <div style="display:flex;gap:10px;justify-content:center">
    <button class="btn alt" id="nextDhikr" data-i="nextd">Next dhikr</button><button class="btn alt" id="reset" data-i="reset">Reset</button>
   </div>
   <p style="color:var(--muted);font-size:13px;margin-top:14px"><span data-i="total">Total</span>: <b id="total">0</b></p>
  </div>
 </section>
 <!-- SETTINGS VIEW -->
 <section class="view" id="v-set">
  <div class="title" data-i="t_set">Settings</div>
  <div class="glass set">
   <label for="countrySel" data-i="country">Country</label><select id="countrySel"></select>
   <label for="citySel" data-i="city">City</label><select id="citySel"></select>
   <input id="citySearch" type="search" autocomplete="off" autocapitalize="words">
   <div class="msg" id="geoMsg" aria-live="polite"></div>
   <label for="fmt" data-i="fmt">Time format</label>
   <select id="fmt"><option value="24" data-i="h24">24-hour</option><option value="12" data-i="h12">12-hour</option></select>
   <label for="theme" data-i="app">Appearance</label>
   <select id="theme"><option value="auto" data-i="auto">Match device</option><option value="dark" data-i="dark">Midnight</option></select>
   <label for="lang" data-i="lang">Language</label>
   <select id="lang"></select>
  </div>
  <div class="src" data-i="note">Times: AlAdhan API with an on-device astronomical fallback.</div>
 </section>
</div>

<nav class="nav"><div id="nav"></div></nav>

<script src="app.js"></script>
</body>
</html>
